<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-crud</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-4">
      <div class="row">
        <div class="col-md-6">
          <form id="todoForm">
            <div class="form-group">
              <label for="todoItemControl" class="sr-only">Todo Item</label>
              <input type="text" id="todoItemControl" class="form-control" placeholder="Todo Item" />
            </div>

            <button class="btn btn-sm btn-primary btn-block" type="submit">Add Todo</button>
          </form>
        </div>

        <div class="col-md-6">
          <ul class="list-group" id="todoList">
            <!-- <li class="list-group-item">
              <strong>
                <button class="btn btn-sm btn-outline-info d-flex justify-content-between">Edit</button>
                <button class="btn btn-sm btn-outline-danger d-flex justify-content-between">Remove</button>
              </strong>
            </li> -->
          </ul>
        </div>
      </div>
    </div>

    <script src="./assets/js/app.js"></script>
  </body>
</html>
